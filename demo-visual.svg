<svg
        xmlns="http://www.w3.org/2000/svg"
        width="1200"
        height="640"
        viewBox="0 0 1200 640"
>
    <rect width="1200" height="640" fill="white"/>

    <text
            x="80"
            y="90"
            font-family="Arial, sans-serif"
            font-size="34"
            font-weight="700"
            fill="#18181b"
    >
        Customer activation funnel
    </text>

    <text
            x="80"
            y="132"
            font-family="Arial, sans-serif"
            font-size="22"
            fill="#71717a"
    >
        The largest conversion drop occurs before first value.
    </text>

    <g
            transform="translate(80 190)"
            font-family="Arial, sans-serif"
    >
        <!-- Signup started -->

        <rect
                x="0"
                y="0"
                width="1040"
                height="72"
                rx="10"
                fill="#27272a"
        />

        <text
                x="24"
                y="45"
                font-size="24"
                font-weight="700"
                fill="white"
        >
            Signup started
        </text>

        <text
                x="1016"
                y="45"
                text-anchor="end"
                font-size="24"
                font-weight="700"
                fill="white"
        >
            100%
        </text>

        <!-- Signup completed -->

        <rect
                x="0"
                y="92"
                width="1040"
                height="72"
                rx="10"
                fill="#f4f4f5"
        />

        <rect
                x="0"
                y="92"
                width="738"
                height="72"
                rx="10"
                fill="#52525b"
        />

        <text
                x="24"
                y="137"
                font-size="24"
                font-weight="700"
                fill="white"
        >
            Signup completed
        </text>

        <text
                x="714"
                y="137"
                text-anchor="end"
                font-size="24"
                font-weight="700"
                fill="white"
        >
            71%
        </text>

        <!-- Activated -->

        <rect
                x="0"
                y="184"
                width="1040"
                height="72"
                rx="10"
                fill="#f4f4f5"
        />

        <rect
                x="0"
                y="184"
                width="447"
                height="72"
                rx="10"
                fill="#a1a1aa"
        />

        <text
                x="24"
                y="229"
                font-size="24"
                font-weight="700"
                fill="#18181b"
        >
            Activated
        </text>

        <text
                x="423"
                y="229"
                text-anchor="end"
                font-size="24"
                font-weight="700"
                fill="#18181b"
        >
            43%
        </text>

        <!-- Retained -->

        <rect
                x="0"
                y="276"
                width="1040"
                height="72"
                rx="10"
                fill="#f4f4f5"
        />

        <rect
                x="0"
                y="276"
                width="364"
                height="72"
                rx="10"
                fill="#d4d4d8"
        />

        <text
                x="24"
                y="321"
                font-size="24"
                font-weight="700"
                fill="#18181b"
        >
            Retained after 30 days
        </text>

        <text
                x="340"
                y="321"
                text-anchor="end"
                font-size="24"
                font-weight="700"
                fill="#18181b"
        >
            35%
        </text>

        <!-- Annotation -->

        <line
                x1="760"
                y1="220"
                x2="880"
                y2="220"
                stroke="#18181b"
                stroke-width="2"
        />

        <circle
                cx="760"
                cy="220"
                r="5"
                fill="#18181b"
        />

        <text
                x="900"
                y="210"
                font-size="20"
                font-weight="700"
                fill="#18181b"
        >
            Largest drop
        </text>

        <text
                x="900"
                y="238"
                font-size="18"
                fill="#71717a"
        >
            28 pts between signup
        </text>

        <text
                x="900"
                y="262"
                font-size="18"
                fill="#71717a"
        >
            completion and activation
        </text>
    </g>
</svg>