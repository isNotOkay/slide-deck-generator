<aside aria-label="Slide navigation">
  <header>
    <div class="header-actions">
      <button
        matButton
        type="button"
        class="open-button"
        aria-label="Open JSON presentation"
        [disabled]="opening() || exporting()"
        (click)="openRequested.emit()"
      >
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">folder_open</mat-icon>
        <span>Open</span>
      </button>

      <button
        matButton
        type="button"
        class="download-button"
        [matMenuTriggerFor]="downloadMenu"
        [disabled]="exporting()"
        [attr.aria-busy]="exporting() ? 'true' : null"
      >
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">download</mat-icon>
        <span>{{ exporting() ? "Exporting…" : "Download" }}</span>
      </button>
    </div>

    <mat-menu #downloadMenu="matMenu" class="download-menu" aria-label="Download options">
      <button
        mat-menu-item
        class="download-menu-item"
        [disabled]="slides().length === 0 || exporting()"
        (click)="pdfRequested.emit()"
      >
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">picture_as_pdf</mat-icon>
        <span class="menu-copy">
          <span class="menu-primary">PDF</span>
          <span class="menu-secondary">All slides</span>
        </span>
      </button>
      <button mat-menu-item class="download-menu-item" (click)="jsonRequested.emit()">
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">data_object</mat-icon>
        <span class="menu-copy">
          <span class="menu-primary">JSON</span>
          <span class="menu-secondary">Source data</span>
        </span>
      </button>
    </mat-menu>
  </header>

  <ol
    cdkScrollable
    cdkDropList
    cdkDropListOrientation="vertical"
    [cdkDropListData]="slides()"
    (cdkDropListDropped)="dropped($event)"
  >
    @for (slide of slides(); track slide; let index = $index) {
      <li cdkDrag [cdkDragData]="slide">
        <div class="thumbnail-row" [class.is-active]="activeIndex() === index">
          <button
            #thumbnail
            type="button"
            class="thumbnail-button"
            [attr.aria-label]="'Go to slide ' + (index + 1) + ': ' + slideTitle(slide)"
            [attr.aria-current]="activeIndex() === index ? 'slide' : null"
            (click)="slideSelected.emit(index)"
          >
            <span class="preview" aria-hidden="true"><app-slide [slide]="slide" /></span>
            <span class="caption">
              <span class="number">{{ index + 1 }}</span>
              <span class="title">{{ slideTitle(slide) }}</span>
            </span>
          </button>
          <button
            type="button"
            cdkDragHandle
            class="drag-handle"
            [attr.aria-label]="'Reorder slide ' + (index + 1)"
            title="Drag to reorder"
          >
            <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">drag_indicator</mat-icon>
          </button>
        </div>
        <div class="drag-placeholder" *cdkDragPlaceholder></div>
      </li>
    }
  </ol>
</aside>
