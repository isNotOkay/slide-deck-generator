<aside aria-label="Slide navigation">
  <ol
    cdkScrollable
    cdkDropList
    cdkDropListOrientation="vertical"
    [cdkDropListData]="slides()"
    (cdkDropListDropped)="dropped($event)"
  >
    @for (slide of slides(); track slide.id; let index = $index) {
      <li cdkDrag [cdkDragData]="slide">
        <div class="thumbnail-row" [class.is-active]="activeIndex() === index">
          <button
            #thumbnail
            type="button"
            class="thumbnail-button"
            [attr.aria-label]="'Go to slide ' + (index + 1) + ': ' + slideTitle(slide)"
            [attr.aria-current]="activeIndex() === index ? 'slide' : null"
            (click)="slideSelected.emit(index)"
          >
            <span class="preview" aria-hidden="true"><app-slide [slide]="slide" /></span>
            <span class="caption">
              <span class="number">{{ index + 1 }}</span>
              <span class="title">{{ slideTitle(slide) }}</span>
            </span>
            @if (markerFor(slide); as marker) {
              <span
                class="review-marker"
                [class.review-marker-added]="marker === 'added'"
                [class.review-marker-modified]="marker === 'modified'"
                [attr.aria-label]="marker === 'added' ? 'Added slide' : 'Modified slide'"
              >
                @if (marker === "added") {
                  <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">add</mat-icon>
                }
              </span>
            }
          </button>
          <button
            type="button"
            cdkDragHandle
            class="drag-handle"
            [attr.aria-label]="'Reorder slide ' + (index + 1)"
            title="Drag to reorder"
          >
            <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">drag_indicator</mat-icon>
          </button>
        </div>
        <div class="drag-placeholder" *cdkDragPlaceholder></div>
      </li>
    }
  </ol>
</aside>
