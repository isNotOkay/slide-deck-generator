openapi: 3.1.0
info:
  title: Slide Deck Generator API
  version: 1.0.0
  description: API for reading, creating, replacing, and incrementally editing the singleton slide deck. The schema
    is authoritative for supported slide layouts and fields. Prefer PATCH for localized edits and PUT only for complete
    replacement.
servers:
  - url: https://159.195.7.18
    description: HTTPS API server
paths:
  /api/deck:
    get:
      operationId: getDeck
      summary: Get the complete deck
      description: Returns the complete current presentation. Use this when whole-deck context is required or when
        the relevant slide ID is not yet known.
      responses:
        '200':
          description: The current deck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: replaceDeck
      summary: Create or replace the complete deck
      description: Creates or replaces the complete presentation. Use for initial generation or full-deck replacement.
        Every slide must conform to a supported slide schema. Prefer patchDeck for localized edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deck'
      responses:
        '200':
          description: The saved complete deck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: patchDeck
      summary: Apply incremental deck edits
      description: Applies semantic edits to the current deck. Batch related changes in one request. The updated deck
        is validated before saving. Use only supported slide types and fields. Prefer this for localized edits.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDeckRequest'
            examples:
              mixedEdits:
                summary: Update, remove, and move slides in one request
                value:
                  operations:
                    - op: updateSlide
                      slideId: market-overview
                      changes:
                        title: Market Outlook
                    - op: removeSlide
                      slideId: appendix-old
                    - op: moveSlide
                      slideId: recommendation
                      afterSlideId: market-overview
      responses:
        '200':
          description: The complete updated deck
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/deck/slides/{slideId}:
    get:
      operationId: getSlide
      summary: Get one slide by ID
      description: Returns one complete slide by its stable ID. Prefer this over getDeck when a known single slide
        provides enough context.
      parameters:
        - name: slideId
          in: path
          required: true
          description: Stable ID of the slide to retrieve.
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: The requested slide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Slide'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  responses:
    BadRequest:
      description: The request or resulting deck is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The deck or requested slide was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: The request body exceeds the server payload limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
      additionalProperties: false
    Deck:
      type: object
      required:
        - title
        - slides
      properties:
        title:
          type: string
        slides:
          type: array
          items:
            $ref: '#/components/schemas/Slide'
          description: Slides in presentation order. Every slide ID must be unique. Each item must conform to exactly
            one supported Slide layout.
      additionalProperties: false
      description: Complete presentation. Slides are stored in presentation order. Every slide must use one of the
        supported Slide schemas and every slide ID must be unique.
    Slide:
      oneOf:
        - $ref: '#/components/schemas/TitleSlide'
        - $ref: '#/components/schemas/SectionSlide'
        - $ref: '#/components/schemas/StatementSlide'
        - $ref: '#/components/schemas/ContentSlide'
        - $ref: '#/components/schemas/SplitSlide'
        - $ref: '#/components/schemas/MetricsSlide'
        - $ref: '#/components/schemas/VisualSlide'
        - $ref: '#/components/schemas/TableSlide'
      discriminator:
        propertyName: type
        mapping:
          title: '#/components/schemas/TitleSlide'
          section: '#/components/schemas/SectionSlide'
          statement: '#/components/schemas/StatementSlide'
          content: '#/components/schemas/ContentSlide'
          split: '#/components/schemas/SplitSlide'
          metrics: '#/components/schemas/MetricsSlide'
          visual: '#/components/schemas/VisualSlide'
          table: '#/components/schemas/TableSlide'
      description: A supported slide layout. Only the slide types defined by this schema are valid. Do not invent
        additional slide types or arbitrary fields.
    TitleSlide:
      type: object
      required:
        - id
        - type
        - title
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - title
        title:
          type: string
        subtitle:
          type: string
      additionalProperties: false
      description: Opening slide for the presentation. Use for the deck title and an optional subtitle.
    SectionSlide:
      type: object
      required:
        - id
        - type
        - title
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - section
        title:
          type: string
        subtitle:
          type: string
      additionalProperties: false
      description: Section divider used to introduce a major new part of the presentation.
    StatementSlide:
      type: object
      required:
        - id
        - type
        - statement
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - statement
        statement:
          type: string
        supportingText:
          type: string
      additionalProperties: false
      description: Use for one prominent takeaway, conclusion, assertion, or key message. Keep the statement concise.
        Do not use this layout for lists or dense explanatory content.
    ContentSlide:
      type: object
      required:
        - id
        - type
        - title
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - content
        title:
          type: string
        body:
          type: string
        bullets:
          type: array
          items:
            type: string
      additionalProperties: false
      description: General-purpose explanatory slide with a title and optional body text and/or bullets.
    SplitSlide:
      type: object
      required:
        - id
        - type
        - title
        - leftItems
        - rightItems
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - split
        title:
          type: string
        leftTitle:
          type: string
        leftItems:
          type: array
          items:
            type: string
        rightTitle:
          type: string
        rightItems:
          type: array
          items:
            type: string
      additionalProperties: false
      description: Two-column layout for comparisons, alternatives, before/after, pros/cons, or two related groups
        of information.
    Metric:
      type: object
      required:
        - value
        - label
      properties:
        value:
          type: string
        label:
          type: string
        context:
          type: string
      additionalProperties: false
      description: One quantitative metric consisting of a prominent value, label, and optional supporting context.
    MetricsSlide:
      type: object
      required:
        - id
        - type
        - title
        - metrics
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - metrics
        title:
          type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
      additionalProperties: false
      description: Use for a small set of important quantitative metrics or KPIs.
    VisualSlide:
      type: object
      required:
        - id
        - type
        - title
        - image
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - visual
        title:
          type: string
        image:
          type: string
        caption:
          type: string
      additionalProperties: false
      description: Use when an image is the central element of the slide. Includes a title, image, and optional
        caption.
    TableSlide:
      type: object
      required:
        - id
        - type
        - title
        - headers
        - rows
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum:
            - table
        title:
          type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
      additionalProperties: false
      description: Use for structured tabular information with column headers and rows.
    PatchDeckRequest:
      type: object
      required:
        - operations
      properties:
        operations:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PatchOperation'
          description: Related deck edits. Batch related operations into one request.
      additionalProperties: false
    PatchOperation:
      oneOf:
        - $ref: '#/components/schemas/UpdateSlideOperation'
        - $ref: '#/components/schemas/AddSlideOperation'
        - $ref: '#/components/schemas/RemoveSlideOperation'
        - $ref: '#/components/schemas/MoveSlideOperation'
        - $ref: '#/components/schemas/UpdateDeckOperation'
      discriminator:
        propertyName: op
        mapping:
          updateSlide: '#/components/schemas/UpdateSlideOperation'
          addSlide: '#/components/schemas/AddSlideOperation'
          removeSlide: '#/components/schemas/RemoveSlideOperation'
          moveSlide: '#/components/schemas/MoveSlideOperation'
          updateDeck: '#/components/schemas/UpdateDeckOperation'
    SlideChanges:
      type: object
      minProperties: 1
      description: Partial properties to merge into an existing slide. Only include fields that should change. The
        slide ID is not editable. Fields must conform to one of the supported slide layouts in this schema. Do not
        invent arbitrary properties.
      properties:
        type:
          type: string
          enum:
            - title
            - section
            - statement
            - content
            - split
            - metrics
            - visual
            - table
        title:
          type: string
        subtitle:
          type: string
        statement:
          type: string
        supportingText:
          type: string
        body:
          type: string
        bullets:
          type: array
          items:
            type: string
        leftTitle:
          type: string
        leftItems:
          type: array
          items:
            type: string
        rightTitle:
          type: string
        rightItems:
          type: array
          items:
            type: string
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/Metric'
        image:
          type: string
        caption:
          type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
      additionalProperties: false
    UpdateSlideOperation:
      type: object
      required:
        - op
        - slideId
        - changes
      properties:
        op:
          type: string
          enum:
            - updateSlide
        slideId:
          type: string
          minLength: 1
        changes:
          $ref: '#/components/schemas/SlideChanges'
          description: Only the supported slide fields that should be changed. The resulting slide must remain valid.
      additionalProperties: false
    AddSlideOperation:
      type: object
      required:
        - op
        - slide
      properties:
        op:
          type: string
          enum:
            - addSlide
        slide:
          $ref: '#/components/schemas/Slide'
          description: A complete new slide using one of the supported slide layouts defined by the Slide schema.
        afterSlideId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
          description: Existing slide ID after which to insert. Use null to insert at the beginning. Omit to append
            to the end.
      additionalProperties: false
    RemoveSlideOperation:
      type: object
      required:
        - op
        - slideId
      properties:
        op:
          type: string
          enum:
            - removeSlide
        slideId:
          type: string
          minLength: 1
      additionalProperties: false
    MoveSlideOperation:
      type: object
      required:
        - op
        - slideId
      properties:
        op:
          type: string
          enum:
            - moveSlide
        slideId:
          type: string
          minLength: 1
        afterSlideId:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
          description: Existing slide ID after which to move this slide. Use null to move to the beginning. Omit
            to move to the end.
      additionalProperties: false
    DeckChanges:
      type: object
      required:
        - title
      properties:
        title:
          type: string
      additionalProperties: false
    UpdateDeckOperation:
      type: object
      required:
        - op
        - changes
      properties:
        op:
          type: string
          enum:
            - updateDeck
        changes:
          $ref: '#/components/schemas/DeckChanges'
      additionalProperties: false
