<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>Slide Deck Generator</title>
</head>

<body>
<div class="reveal">
    <button
            type="button"
            class="slide-navigator-toggle"
            id="slide-navigator-toggle"
            aria-controls="slide-navigator"
            aria-expanded="false"
            aria-label="Open slide navigator"
            hidden
    >
        <span aria-hidden="true">☰</span>
        <span>Slides</span>
    </button>

    <aside
            class="slide-navigator"
            id="slide-navigator"
            aria-label="Slide navigation"
            aria-hidden="true"
            hidden
    >
        <div class="slide-navigator-header">
            <h2>Slides</h2>
            <span id="slide-navigator-count"></span>
        </div>

        <ol class="slide-navigator-list" id="slide-navigator-list"></ol>
    </aside>

    <div class="slides" id="slides"></div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
